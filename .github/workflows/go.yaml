name: Go

# The Go module: lint, unit tests, and a GoReleaser snapshot of the binaries
# and the container image. ci.yaml calls it for pull requests, release.yaml
# gates every release on it, and it runs on its own from the Actions tab.
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

env:
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first, the docs
  # toolchain included, which makes each job wait on downloads it never uses.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.3
  # Every tool a CI job runs, installed in every job. mise-action keys its
  # cache on install_args, so one list means one cache: main's runs save it
  # and every pull request restores it, rather than each job, and each pull
  # request, keeping a copy of its own subset.
  MISE_TOOLS: go golangci-lint yamllint actionlint shellcheck goreleaser

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # Go's module and build caches, and golangci-lint's analysis cache. Like
      # setup-go, the key is the dependency set: the first run after go.sum
      # changes saves it (main's run, which pull requests then restore), and it
      # isn't rewritten until go.sum changes again. The dependencies, which are
      # most of the build, stay cached throughout. Each job keys its own,
      # because each builds for different flags or targets.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-

      - name: Restore custom-gcl cache
        id: custom-gcl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', '.mise.toml') }}

      # Builds ./custom-gcl (golangci-lint + golint-sl) and runs it. The golint-sl
      # plugin and the gofmt/goimports formatters are both applied here.
      - name: Lint Go
        if: steps.custom-gcl-cache.outputs.cache-hit != 'true'
        run: mise run lint

      - name: Lint Go with cached custom-gcl
        if: steps.custom-gcl-cache.outputs.cache-hit == 'true'
        run: |
          chmod +x ./custom-gcl
          ./custom-gcl run ./...

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # See the lint job. The build cache holds test results too, so a package
      # whose code and inputs didn't change since the cache was saved reports
      # (cached) rather than running again.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: Run tests
        run: mise run test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: go
          fail_ci_if_error: false

  build:
    name: Build with GoReleaser
    runs-on: ubuntu-latest
    # GoReleaser builds the binaries and the image from the Go module, so it
    # waits for that to be linted and tested.
    needs:
      - lint
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # See the lint job.
      - name: Cache Go modules and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-goreleaser-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-goreleaser-${{ runner.os }}-

      # The snapshot builds the multi-platform image as the release does, so a
      # broken Dockerfile fails here rather than at release time.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GoReleaser builds the tagged tree unchanged, so go.mod must be tidy
      # before it's ever tagged.
      - name: Check go.mod is tidy
        run: mise run mod-tidy

      - name: Validate GoReleaser config
        run: mise run release-check

      - name: Build with GoReleaser (snapshot)
        run: mise run snapshot
