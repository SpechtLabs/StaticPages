version: 2

project_name: staticpages

# StaticPages is a server and ships as a container image; the archives carry
# the same Linux binaries for running it outside a container.
builds:
  - id: server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: staticpages
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X=main.Version={{ .Version }}
      - -X=main.Commit={{ .Commit }}
      - -X=main.Date={{ .CommitDate }}
      - -X=main.BuiltBy=goreleaser

archives:
  - id: server
    ids:
      - server
    name_template: "staticpages_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Multi-platform image on GHCR. A snapshot builds it without pushing.
dockers_v2:
  - id: oci-bundle
    dockerfile: Dockerfile
    ids:
      - server
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - ghcr.io/spechtlabs/staticpages
    tags:
      - latest
      - "{{ .Tag }}"
      - "v{{ .Major }}"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    flags:
      - "--pull"

# Keyless cosign signature of the pushed image, by digest.
docker_signs:
  - id: oci-bundle-sign
    artifacts: images
    args:
      - sign
      - "${artifact}"
      - --yes

# A keyless cosign signature over checksums.txt, as a Sigstore bundle, covers
# every archive through its checksum. `artifacts: binary` would sign nothing:
# it only matches binaries released on their own, and ours ship in archives.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

# release-please writes the changelog and creates the GitHub release; GoReleaser
# only attaches the artifacts to it.
changelog:
  disable: true

release:
  github:
    owner: SpechtLabs
    name: StaticPages
  mode: keep-existing
